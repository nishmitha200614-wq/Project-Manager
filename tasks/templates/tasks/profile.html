<!DOCTYPE html>
<html>
<head>
    <title>Profile - Project Manager</title>

    <style>
        body {
            font-family: Arial;
            background: #f3f4f6;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 40px;
            border-radius: 12px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>👤 My Profile</h1>

    <h2>{{ user.username }}</h2>

    <p>Email: {{ user.email }}</p>

    <a href="{% url 'home' %}">
        ← Home
    </a>

    <a href="{% url 'logout' %}">
        Logout
    </a>

</div>

</body>
</html>
