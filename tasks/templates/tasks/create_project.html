<!DOCTYPE html>
<html>
<head>

    <title>Create Project</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f9;
        }

        .navbar {
            background: #172554;
            color: white;
            padding: 20px 45px;
            display: flex;
            justify-content: space-between;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        h1 {
            color: #172554;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <strong>📋 ProjectManager</strong>

        <div>
            <a href="{% url 'home' %}">Dashboard</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>

    </div>


    <div class="container">

        <div class="card">

            <h1>📁 Create New Project</h1>

            <form method="POST">

                {% csrf_token %}

                <label>Project Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter project name"
                    required
                >


                <label>Project Description</label>

                <textarea
                    name="description"
                    placeholder="Describe your project..."
                ></textarea>


                <button type="submit">
                    Create Project
                </button>

            </form>

            <a
                class="back"
                href="{% url 'home' %}"
            >
                ← Back to Dashboard
            </a>

        </div>

    </div>

</body>
</html>
