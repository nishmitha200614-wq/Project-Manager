<!DOCTYPE html>
<html>

<head>

    <title>Notifications - Project Manager</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f9;
            color: #1f2937;
        }

        .navbar {
            background: #172554;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 22px;
            font-weight: bold;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;

            box-shadow:
                0 4px 15px rgba(0,0,0,.08);
        }

        h1 {
            color: #172554;
        }

        .notification {
            padding: 18px;
            border-bottom: 1px solid #e5e7eb;
        }

        .notification:last-child {
            border-bottom: none;
        }

        .notification.unread {
            background: #eff6ff;
            border-left: 4px solid #2563eb;
        }

        .message {
            font-size: 16px;
            font-weight: 500;
        }

        .date {
            margin-top: 6px;
            color: #9ca3af;
            font-size: 13px;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }

        .read-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 18px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="navbar">

    <div class="brand">
        📋 Project Manager
    </div>

    <div>

        <a href="{% url 'home' %}">
            Dashboard
        </a>

        <a href="{% url 'profile' %}">
            Profile
        </a>

        <a href="{% url 'logout' %}">
            Logout
        </a>

    </div>

</div>


<div class="container">

    <div class="card">

        <h1>
            🔔 Notifications
        </h1>


        {% for notification in notifications %}

            <div
                class="notification {% if not notification.is_read %}unread{% endif %}"
            >

                <div class="message">
                    {{ notification.message }}
                </div>

                <div class="date">
                    {{ notification.created_at|date:"d M Y, H:i" }}
                </div>

            </div>

        {% empty %}

            <div class="empty">
                🎉 You don't have any notifications yet.
            </div>

        {% endfor %}


        {% if notifications %}

            <a
                href="{% url 'mark_notifications_read' %}"
                class="read-btn"
            >
                ✓ Mark All as Read
            </a>

        {% endif %}

    </div>

</div>


</body>

</html>
