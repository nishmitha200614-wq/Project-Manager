<!DOCTYPE html>
<html>

<head>

    <title>Create Task - Project Manager</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6f9;
            color: #1f2937;
        }

        .navbar {
            background: #172554;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 22px;
            font-weight: bold;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;

            box-shadow:
                0 4px 15px rgba(0,0,0,.08);
        }

        h1 {
            color: #172554;
            margin-top: 0;
        }

        .project-name {
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            margin-top: 20px;
        }

        input,
        textarea,
        select {

            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .create-btn {

            width: 100%;

            margin-top: 30px;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        .create-btn:hover {
            background: #1d4ed8;
        }

        .back {

            display: inline-block;

            margin-top: 20px;

            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }

        .messages {
            margin-bottom: 20px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<div class="navbar">

    <div class="brand">
        📋 Project Manager
    </div>

    <div>

        <a href="{% url 'home' %}">
            Dashboard
        </a>

        <a href="{% url 'profile' %}">
            Profile
        </a>

        <a href="{% url 'logout' %}">
            Logout
        </a>

    </div>

</div>


<!-- MAIN -->

<div class="container">

    <div class="card">

        <h1>
            ➕ Create New Task
        </h1>

        <div class="project-name">
            Project: <strong>{{ project.name }}</strong>
        </div>


        {% if messages %}

            <div class="messages">

                {% for message in messages %}

                    <div class="error">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}


        <!-- TASK FORM -->

        <form
            method="POST"
            action="{% url 'create_task' project.id %}"
        >

            {% csrf_token %}


            <label for="title">
                Task Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="Enter task title"
                required
            >


            <label for="description">
                Task Description
            </label>

            <textarea
                id="description"
                name="description"
                placeholder="Describe what needs to be done..."
            ></textarea>


            <label for="assigned_to">
                Assign To
            </label>

            <select
                id="assigned_to"
                name="assigned_to"
            >

                <option value="">
                    -- Unassigned --
                </option>

                {% for user in users %}

                    <option value="{{ user.username }}">
                        {{ user.username }}
                    </option>

                {% endfor %}

            </select>


            <button
                type="submit"
                class="create-btn"
            >
                Create Task
            </button>

        </form>


        <a
            href="{% url 'project_detail' project.id %}"
            class="back"
        >
            ← Back to Project
        </a>

    </div>

</div>


</body>

</html>
